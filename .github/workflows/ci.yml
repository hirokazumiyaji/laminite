name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest with coverage
        run: |
          set -o pipefail
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo '```'
            uv run pytest --cov --cov-report=term-missing
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  microbench:
    name: Microbenchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: microbench-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      # The A/B harness only needs the base tip's tree (worktree + uv sync),
      # so a depth-1 fetch is sufficient and keeps the job cheap.
      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group bench

      - name: Run microbenchmark gate
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run --group bench python -m benchmarks.run_micro --quick --gate --compare-ref "$BASE_REF"
          else
            uv run --group bench python -m benchmarks.run_micro --quick --gate
          fi
