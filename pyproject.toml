[project]
name = "laminite"
version = "0.1.0"
description = "A minimal ASGI web framework with msgspec and startup-time compilation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hirokazu Miyaji", email = "hirokazu.miyaji@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "msgspec",
]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hirokazumiyaji/laminite"
Documentation = "https://github.com/hirokazumiyaji/laminite#readme"
Repository = "https://github.com/hirokazumiyaji/laminite"
Issues = "https://github.com/hirokazumiyaji/laminite/issues"
Changelog = "https://github.com/hirokazumiyaji/laminite/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/laminite-opentelemetry"]

[tool.uv.sources]
laminite = { workspace = true }
laminite-opentelemetry = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.9",
    "laminite-opentelemetry",
    "opentelemetry-sdk>=1.20",
]
bench = [
    "fastapi>=0.115",
    "granian>=1.0",
    "litestar>=2.0",
    "pyperf>=2.0",
    "starlette>=0.40",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks", "packages/laminite-opentelemetry/src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["laminite", "laminite_opentelemetry"]

[tool.pyright]
include = ["src", "packages/laminite-opentelemetry/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages/laminite-opentelemetry/tests"]
addopts = ["-q"]

[tool.coverage.run]
source = ["laminite", "laminite_opentelemetry"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
